[project]
name = "voicefork"
dynamic = ["version"]
description = "Free, open-source real-time voice changer: AI voices, effects, soundboard. Runs 100% locally."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "sounddevice>=0.4.6", "PySide6>=6.6", "pynput>=1.7", "soundfile>=0.12", "comtypes>=1.2; sys_platform == 'win32'"]

[project.optional-dependencies]
ai = ["transformers>=4.49.0,<4.50", "librosa>=0.10.2,<0.11", "torchfcpe>=0.0.4,<0.1", "faiss-cpu>=1.13.0,<2", "huggingface_hub>=0.24"]
dev = ["pytest"]

[project.urls]
Homepage = "https://github.com/Dank-zz/voicefork"
Issues = "https://github.com/Dank-zz/voicefork/issues"

[project.scripts]
voicefork = "voicefork.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = { attr = "voicefork.__version__" }

[tool.setuptools.packages.find]
include = ["voicefork*"]
namespaces = true

[tool.setuptools.package-data]
"*" = ["*.json", "LICENSE-RVC", "*.md", "*.ico"]
